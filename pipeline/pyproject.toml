[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "versorgungsatlas-pipeline"
version = "0.1.0"
description = "Dagster pipeline for Versorgungsatlas data ingestion and transformation"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.8",
    "dagster-postgres>=0.24",
    "dagster-webserver>=1.8",
    "dagster-daemon>=1.8",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pandas>=2.2",
    "lxml>=5.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
