services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-versorgungsatlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-versorgungsatlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dagster-webserver:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/workspace.yaml
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://atlas:atlas_dev_password@postgres:5432/versorgungsatlas}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://atlas:atlas_dev_password@postgres:5432/versorgungsatlas}
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - dagster-home:/opt/dagster/dagster_home
      - ./pipeline:/opt/dagster/app/pipeline:ro
      - ./data:/data:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dagster-daemon:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: dagster-daemon run -w /opt/dagster/workspace.yaml
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://atlas:atlas_dev_password@postgres:5432/versorgungsatlas}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://atlas:atlas_dev_password@postgres:5432/versorgungsatlas}
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - dagster-home:/opt/dagster/dagster_home
      - ./pipeline:/opt/dagster/app/pipeline:ro
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://atlas:atlas_dev_password@postgres:5432/versorgungsatlas}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://atlas:atlas_dev_password@postgres:5432/versorgungsatlas}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  dagster-home:
